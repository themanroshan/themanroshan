<svg xmlns="http://www.w3.org/2000/svg" width="430" height="175" viewBox="0 0 430 175" role="img" aria-label="House Price Prediction">
  <defs><style>
    .t { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
    .d { font: 400 13.5px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
    .chip { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  </style></defs>
  <rect width="430" height="175" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <rect class="glow" x="0" y="0" width="6" height="175" rx="3" fill="#34d399"/>
  <text x="24" y="40" class="t">House Price Prediction</text>
  <text x="24" y="68" class="d">Regression model that estimates house prices from</text>
  <text x="24" y="88" class="d">property features.</text>
  <rect x="24" y="128" width="70" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-opacity=".6"/><text x="59.0" y="146" text-anchor="middle" class="chip">Python</text><rect x="102" y="128" width="118" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-opacity=".6"/><text x="161.0" y="146" text-anchor="middle" class="chip">scikit-learn</text><rect x="228" y="128" width="70" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-opacity=".6"/><text x="263.0" y="146" text-anchor="middle" class="chip">Pandas</text>
</svg>