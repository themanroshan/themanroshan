<svg xmlns="http://www.w3.org/2000/svg" width="430" height="175" viewBox="0 0 430 175" role="img" aria-label="StudyAI - RAG Study Assistant">
  <defs><style>
    .t { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
    .d { font: 400 13.5px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
    .chip { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  </style></defs>
  <rect width="430" height="175" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <rect class="glow" x="0" y="0" width="6" height="175" rx="3" fill="#a78bfa"/>
  <text x="24" y="40" class="t">StudyAI - RAG Study Assistant</text>
  <text x="24" y="68" class="d">Answers study questions from your own notes using</text>
  <text x="24" y="88" class="d">retrieval-augmented generation.</text>
  <rect x="24" y="128" width="46" height="26" rx="13" fill="#1e293b" stroke="#a78bfa" stroke-opacity=".6"/><text x="47.0" y="146" text-anchor="middle" class="chip">RAG</text><rect x="78" y="128" width="54" height="26" rx="13" fill="#1e293b" stroke="#a78bfa" stroke-opacity=".6"/><text x="105.0" y="146" text-anchor="middle" class="chip">Groq</text><rect x="140" y="128" width="78" height="26" rx="13" fill="#1e293b" stroke="#a78bfa" stroke-opacity=".6"/><text x="179.0" y="146" text-anchor="middle" class="chip">FastAPI</text><rect x="226" y="128" width="78" height="26" rx="13" fill="#1e293b" stroke="#a78bfa" stroke-opacity=".6"/><text x="265.0" y="146" text-anchor="middle" class="chip">MongoDB</text>
</svg>