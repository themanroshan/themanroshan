<svg xmlns="http://www.w3.org/2000/svg" width="430" height="175" viewBox="0 0 430 175" role="img" aria-label="Sales Forecasting &amp; Demand Intelligence">
  <defs><style>
    .t { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
    .d { font: 400 13.5px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
    .chip { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  </style></defs>
  <rect width="430" height="175" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <rect class="glow" x="0" y="0" width="6" height="175" rx="3" fill="#38bdf8"/>
  <text x="24" y="40" class="t">Sales Forecasting &amp; Demand Intelligence</text>
  <text x="24" y="68" class="d">Forecasts sales demand with time-series and ML models,</text>
  <text x="24" y="88" class="d">and presents results in a Streamlit dashboard.</text>
  <rect x="24" y="128" width="78" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6"/><text x="63.0" y="146" text-anchor="middle" class="chip">Prophet</text><rect x="110" y="128" width="70" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6"/><text x="145.0" y="146" text-anchor="middle" class="chip">SARIMA</text><rect x="188" y="128" width="78" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6"/><text x="227.0" y="146" text-anchor="middle" class="chip">XGBoost</text><rect x="274" y="128" width="94" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6"/><text x="321.0" y="146" text-anchor="middle" class="chip">Streamlit</text>
</svg>